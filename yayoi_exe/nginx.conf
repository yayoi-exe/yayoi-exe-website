server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静的アセットのキャッシュ
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA なので未知のパスは index.html にフォールバック（react-router 対応）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
